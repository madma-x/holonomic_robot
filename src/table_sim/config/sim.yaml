# Simulator settings (robot model, tool timings, lidar, light physics).
# The same robot model is used for both robots unless `opponent_robot`
# overrides some keys.

robot:
  side: 0.34                 # equilateral triangle, face length (m)
  face_angles_deg: [0, 120, 240]   # outward normal of face 0,1,2 in base_footprint
  boxes_per_face: 3          # boxes held on one face (as a stack)
  max_lin_vel: 1.0           # m/s, clamp of commanded speed
  max_lin_acc: 1.5           # m/s^2
  max_ang_vel: 4.0           # rad/s
  max_ang_acc: 12.0          # rad/s^2
  cmd_timeout: 0.5           # s without /cmd_vel -> robot brakes
  mast_size: 0.08            # square beacon support seen by the other lidar

opponent_robot:              # keys missing here are copied from `robot`
  side: 0.34
  max_lin_vel: 0.8

tool:
  pick_engage_time: 0.40     # s before the boxes are attached (reach checked then)
  pick_time_per_box: 0.20    # s added per box taken (lift)
  pick_reach: 0.05           # max gap face <-> stack at engage time
  pick_max_angle_deg: 25.0   # max misalignment face normal <-> stack
  pick_max_lateral: 0.12     # face centre may be this far off the stack side centre
  drop_time: 0.60            # s to release a face

lidar:
  samples: 500               # SL C1 ~ 0.72 deg at 10 Hz
  rate: 10.0
  detect_range: 1.0          # opponent only visible inside this radius
  range_max: 12.0            # value written in the LaserScan message
  noise_std: 0.008
  dropout: 0.02              # probability a valid return is lost
  yaw_offset: 3.14           # base_scan yaw in the URDF (lidar_joint rpy)
  see_walls: false           # mast lidar is above the 70 mm borders
  see_bodies: false          # true: also see robot triangles, not only masts

physics:
  dt: 0.01                   # internal integration step

opponent:
  behavior: mirror           # mirror | greedy | raider | center_first | random | blocker | idle | teleop
  avoid_us: true             # false = it drives through, to stress-test our reactions
  speed_scale: 1.0
  seed: 0
