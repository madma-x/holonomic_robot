# Simulator settings (robot model, tool timings, lidar, light physics).
# The same robot model is used for both robots unless `opponent_robot`
# overrides some keys.

robot:
  # Hexagon: equilateral triangle with each 60deg corner cut off - 3 long
  # (face) edges alternating with 3 short (corner) edges, matching the real
  # chassis's cut corners (Max's request) instead of a bare pointy triangle.
  # See geometry.polygon_from_truncated_triangle.
  face_long_m: 0.22          # long (face) edge length (m)
  face_short_m: 0.08         # short (corner) edge length (m)
  face_angles_deg: [0, 120, 240]   # outward normal of face 0,1,2 in base_footprint
  boxes_per_face: 3          # boxes held on one face (as a stack)
  max_lin_vel: 1.0           # m/s, clamp of commanded speed
  max_lin_acc: 1.5           # m/s^2
  max_ang_vel: 4.0           # rad/s
  max_ang_acc: 12.0          # rad/s^2
  cmd_timeout: 0.5           # s without /cmd_vel -> robot brakes
  mast_size: 0.08            # square beacon support seen by the other lidar
  flip_face: 0               # the one face that can flip its boxes vertical (FaceTool FLIP)

opponent_robot:              # keys missing here are copied from `robot`
  face_long_m: 0.22
  face_short_m: 0.08
  max_lin_vel: 0.8

tool:
  pick_engage_time: 0.40     # s before the boxes are attached (reach checked then)
  pick_time_per_box: 0.20    # s added per box taken (lift)
  pick_reach: 0.05           # max gap face <-> stack at engage time
  pick_max_angle_deg: 25.0   # max misalignment face normal <-> stack
  pick_max_lateral: 0.12     # face centre may be this far off the stack side centre
  drop_time: 0.60            # s to release a face
  flip_time: 0.50            # s to flip a face's held boxes horizontal -> vertical

lidar:
  samples: 500               # SL C1 ~ 0.72 deg at 10 Hz
  rate: 10.0
  # opponent only visible inside this radius. The physically-derived value
  # (real mast, 7cm min diameter, needing >=2 consecutive beam hits to be a
  # confident detection at 500 samples/360deg: 0.07 / (2 * 2pi/500) ~= 2.79m)
  # is 2.8 - lowered to 1.1 (Max's request, for avoidance testing).
  detect_range: 1.1
  range_max: 12.0            # value written in the LaserScan message
  noise_std: 0.008
  dropout: 0.02              # probability a valid return is lost
  yaw_offset: 3.14           # base_scan yaw in the URDF (lidar_joint rpy)
  see_walls: false           # mast lidar is above the 70 mm borders
  see_bodies: false          # true: also see robot triangles, not only masts

# Face-mounted box-ArUco camera: checks pick-stack occupancy while driving
# by, without needing to be right next to the stack. Pure 2D model (no pitch -
# table_sim has no z-height physics anywhere) - just an FOV cone + max range.
# max_range computed for an 8x8cm tag needing ~15px/side to decode reliably
# at 1280px width / 160deg HFOV (720p, a bit conservative since 160deg is a
# strong fisheye with real distortion this linear estimate ignores):
# (0.08 * (1280/(160*pi/180))) / 15 ~= 2.44m -> 2.5m.
camera:
  hfov_deg: 160.0
  max_range: 2.5
  face: 0                    # mounted on face 0 (front)
  rate: 15.0

physics:
  dt: 0.01                   # internal integration step

# odom_sim republishes ground truth verbatim as a perfect /odom and an
# identity map->odom (noise simulation was tried and pulled back out - see
# table_sim/odom_sim.py).

opponent:
  behavior: mirror           # mirror | greedy | raider | center_first | random | blocker | idle | teleop
  avoid_us: true             # false = it drives through, to stress-test our reactions
  speed_scale: 1.0
  seed: 0
  # Low-level emergency brake on the opponent's own commanded velocity
  # (world.py's _opponent_safety_brake), independent of behaviour/avoid_us -
  # applies even to a raw `teleop`-driven opponent, which otherwise has no
  # avoidance at all. Only clamps the velocity component closing on us,
  # ramping from full speed at gap=min_gap+margin down to zero at gap=min_gap
  # (edge-to-edge, not centre-to-centre).
  safety_stop_enabled: true
  safety_stop_margin_m: 0.2
  safety_stop_min_gap_m: 0.03
