bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 50
    default_server_timeout: 20
    transform_tolerance: 0.3
    enable_groot_monitoring: False
    default_nav_to_pose_bt_xml: /home/ovoleur/holonomic_robot/src/robot_application/config/bt_nav_to_pose_no_fallback.xml
    default_nav_through_poses_bt_xml: /home/ovoleur/holonomic_robot/src/robot_application/config/bt_nav_through_poses_no_fallback.xml
    error_code_names:
      - follow_path_error_code
      - compute_path_error_code

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    cmd_vel_topic: "cmd_vel_nav"
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    current_goal_checker: "goal_checker"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.14
      stateful: False

    FollowPath:
      plugin: "motion_controller::PurePursuitController"
      lookahead_dist: 0.3
      lookahead_time: 0.6
      min_lookahead: 0.2
      max_lookahead: 0.8
      k_xy: 1.8
      k_theta: 0.1
      max_vx: 1.0
      max_vy: 1.0
      max_wz: 1.0
      max_ax: 5.0
      max_ay: 5.0
      max_aw: 20.0
      goal_dist_tolerance: 0.02
      goal_yaw_tolerance: 3.14
      linear_speed_for_wz_scale_start: 0.12
      linear_speed_for_wz_scale_end: 0.3
      min_wz_scale_at_high_speed: 0.3
      output_rotate_deg: 0.0
      output_invert_x: false
      output_invert_y: false
      output_invert_wz: false
      enable_local_path_validity_check: true
      local_path_check_distance: 1.2
      local_path_invalid_cost_threshold: 253
      local_path_unknown_is_invalid: true
      publish_lookahead_point: true
      lookahead_topic: /debug/lookahead_point

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.15, 0.0], [0.138, 0.057], [0.106, 0.106], [0.057, 0.138], [0.0, 0.15], [-0.057, 0.138], [-0.106, 0.106], [-0.138, 0.057], [-0.15, 0.0], [-0.138, -0.057], [-0.106, -0.106], [-0.057, -0.138], [0.0, -0.15], [0.057, -0.138], [0.106, -0.106], [0.138, -0.057]]"
      footprint_padding: 0.02
      transform_tolerance: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: base_scan
          data_type: LaserScan
          obstacle_max_range: 2.0
          obstacle_min_range: 0.13
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: false
        filter_info_topic: "/costmap_filter_info"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 4.0
        inflation_radius: 0.4
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 3.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      footprint: "[[0.15, 0.0], [0.138, 0.057], [0.106, 0.106], [0.057, 0.138], [0.0, 0.15], [-0.057, 0.138], [-0.106, 0.106], [-0.138, 0.057], [-0.15, 0.0], [-0.138, -0.057], [-0.106, -0.106], [-0.057, -0.138], [0.0, -0.15], [0.057, -0.138], [0.106, -0.106], [0.138, -0.057]]"
      footprint_padding: 0.02
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.3
      plugins: ["static_layer", "custom_objects_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
      custom_objects_layer:
        plugin: "custom_objects_layer::CustomObjectsLayer"
        enabled: true
        topic: "/custom_objects"
        object_size_x: 0.15
        object_size_y: 0.20
        lethal_cost: 254
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: false
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: base_scan
          data_type: LaserScan
          obstacle_max_range: 4.0
          obstacle_min_range: 0.13
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: true

          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 5.0
        inflation_radius: 0.2
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true
      transform_tolerance: 0.3

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False


robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower_rclcpp_node:
  ros__parameters:
    use_sim_time: False

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 5.0
    source_timeout: 5.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintStop", "FootprintApproach"]
    FootprintStop:
      type: "polygon"
      action_type: "stop"
      points: "[[0.20, 0.0], [0.185, 0.077], [0.141, 0.141], [0.077, 0.185], [0.0, 0.20], [-0.077, 0.185], [-0.141, 0.141], [-0.185, 0.077], [-0.20, 0.0], [-0.185, -0.077], [-0.141, -0.141], [-0.077, -0.185], [0.0, -0.20], [0.077, -0.185], [0.141, -0.141], [0.185, -0.077]]"
      visualize: True
      enabled: True
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      points: "[[0.45, 0.0], [0.414, 0.171], [0.318, 0.318], [0.171, 0.414], [0.0, 0.45], [-0.171, 0.414], [-0.318, 0.318], [-0.414, 0.171], [-0.45, 0.0], [-0.414, -0.171], [-0.318, -0.318], [-0.171, -0.414], [0.0, -0.45], [0.171, -0.414], [0.318, -0.318], [0.414, -0.171]]"
      time_before_collision: 1.2
      simulation_time_step: 0.02
      visualize: True
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.05
      max_height: 0.5
      enabled: True

filter_mask_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: False
    type: 0
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/filter_mask"
    base: 0.0
    multiplier: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names: ['controller_server', 'planner_server', 'bt_navigator', 'local_costmap', 'global_costmap']

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names: ['map_server', 'filter_mask_server', 'costmap_filter_info_server']
